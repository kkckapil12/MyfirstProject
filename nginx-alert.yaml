apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nginx-cpu-alert
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: nginx.rules
    rules:
    - alert: NginxHighCPU
      expr: sum(rate(container_cpu_usage_seconds_total{namespace="default",container!="",pod=~"demo-nginx.*"}[1m])) by (pod) > 0.05
      for: 30s
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on nginx pod"
        description: "Pod {{ $labels.pod }} CPU usage above threshold"
