apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nginx-high-cpu
  namespace: monitoring
spec:
  groups:
  - name: nginx.rules
    rules:
    - alert: NginxHighCPU
      expr: sum(rate(container_cpu_usage_seconds_total{pod=~"demo-nginx.*"}[1m])) by (pod) > 0.08
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on nginx pod"
        description: "Pod {{ $labels.pod }} CPU usage above 80%"

